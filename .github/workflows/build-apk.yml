name: Build Android APK

# Builds INTERCEPTOR debug + release APKs and publishes them as a GitHub Release
# so there is a stable, direct download link. Artifacts are also kept per-run.

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      create_release:
        description: "Publish the APKs to the rolling 'apk-latest' release"
        type: boolean
        default: true

# Needed by softprops/action-gh-release to create/update the release.
permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  ANDROID_PLATFORM: "platforms;android-36.1"
  ANDROID_BUILD_TOOLS: "build-tools;36.1.0"

jobs:
  build:
    name: Assemble APKs
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # Deliberately NOT using android-actions/setup-android@v3: on current runner images it
      # aborts with "Failed to find package 'tools'", because the legacy 'tools' SDK package it
      # tries to preinstall no longer exists in cmdline-tools 16.x. The ubuntu runner image
      # already ships the Android SDK + cmdline-tools, so this drives sdkmanager directly.
      - name: Configure Android SDK and install required packages
        run: |
          set -euo pipefail

          if [ -z "${ANDROID_HOME:-}" ] && [ -d /usr/local/lib/android/sdk ]; then
            ANDROID_HOME=/usr/local/lib/android/sdk
          fi
          ANDROID_SDK_ROOT="$ANDROID_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME"         >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | tail -1)"
          fi
          echo "Using sdkmanager: $SDKMANAGER"

          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true

          "$SDKMANAGER" --install "platform-tools" "$ANDROID_PLATFORM" "$ANDROID_BUILD_TOOLS"
          "$SDKMANAGER" --install "build-tools;36.0.0" || true

          echo "--- installed platforms ---"
          ls "$ANDROID_HOME/platforms"

      # The Gradle wrapper is committed (gradle-wrapper.properties pins 9.3.1), so ./gradlew
      # provisions the correct distribution itself; this action adds dependency/wrapper caching.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      # app/build.gradle.kts hard-codes:
      #   debug   -> ${rootDir}/debug.keystore       (alias androiddebugkey / android / android)
      #   release -> ${KEYSTORE_PATH or rootDir/my-upload-key.jks} (alias upload)
      # Neither file is committed (.gitignore excludes them), so CI must create them.
      - name: Generate signing keystores
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD || 'interceptor-ci' }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD || 'interceptor-ci' }}
        run: |
          set -euo pipefail

          if [ -n "${RELEASE_KEYSTORE_BASE64:-}" ]; then
            echo "==> Restoring release keystore from RELEASE_KEYSTORE_BASE64 secret"
            printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > my-upload-key.jks
          else
            echo "==> Generating ephemeral release keystore (no RELEASE_KEYSTORE_BASE64 secret set)"
            keytool -genkeypair -v \
              -keystore my-upload-key.jks -storetype JKS \
              -storepass "$STORE_PASSWORD" -keypass "$KEY_PASSWORD" \
              -alias upload -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Interceptor Release, OU=Android, O=Interceptor, L=Unknown, ST=Unknown, C=IN"
          fi

          echo "==> Generating debug keystore expected by the debugConfig signing config"
          keytool -genkeypair -v \
            -keystore debug.keystore -storetype JKS \
            -storepass android -keypass android \
            -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug, O=Android, C=US"

          ls -la my-upload-key.jks debug.keystore

      - name: Build debug APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD || 'interceptor-ci' }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD || 'interceptor-ci' }}
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Build release APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD || 'interceptor-ci' }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD || 'interceptor-ci' }}
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Collect APKs and checksums
        if: always()
        run: |
          set -uo pipefail
          VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -1)
          VERSION=${VERSION:-1.0.0}
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

          mkdir -p dist
          for variant in debug release; do
            src="app/build/outputs/apk/${variant}/app-${variant}.apk"
            if [ -f "$src" ]; then
              cp "$src" "dist/INTERCEPTOR-${VERSION}-${variant}.apk"
              echo "collected $src"
            else
              echo "::warning::missing $src"
            fi
          done

          if [ -n "$(ls -A dist 2>/dev/null)" ]; then
            ( cd dist && sha256sum ./*.apk > SHA256SUMS.txt && cat SHA256SUMS.txt )
          fi

      - name: Upload APKs as run artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: INTERCEPTOR-apk-${{ github.run_number }}
          path: dist/*
          if-no-files-found: warn
          retention-days: 90

      - name: Publish to rolling 'apk-latest' release
        if: ${{ always() && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.create_release)) }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: "INTERCEPTOR ${{ env.VERSION }} (latest CI build)"
          body: |
            Automatically built APKs for **INTERCEPTOR ${{ env.VERSION }}**.

            - Commit: `${{ github.sha }}`
            - Built by: [run #${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
            - Version: `${{ env.VERSION }}`

            | File | Notes |
            | --- | --- |
            | `INTERCEPTOR-${{ env.VERSION }}-debug.apk` | Debug build, signed with the Android debug key |
            | `INTERCEPTOR-${{ env.VERSION }}-release.apk` | Release build (not minified), signed with the CI release key |

            Verify the download with `SHA256SUMS.txt`, then install on a device with
            *Install unknown apps* enabled for your file manager or browser.
          files: dist/*
          fail_on_unmatched_files: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
